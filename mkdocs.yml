site_name: Learn with Nelson
site_description: Beginner-first technology tutorials, career paths, projects, and AI-at-work learning resources.
site_author: Nelson J. D'Souza
site_url: https://nelsondsouza.github.io/

repo_name: nelsondsouza/learn-with-nelson
repo_url: https://github.com/nelsondsouza/learn-with-nelson
edit_uri: edit/main/site/

docs_dir: site
site_dir: _site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # - pymdownx.emoji:
  #     emoji_index: !!python/name:material.extensions.emoji.twemoji
  #     emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nelsondsouza
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/nelson-j-dsouza/

copyright: Copyright &copy; Nelson J. D'Souza

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Start Here:
          - tutorials/start-here/index.md
          - "T00 — How to Start Learning Tech": tutorials/start-here/t00-how-to-start-learning-tech.md
      - Foundations:
          - tutorials/foundations/index.md
          - "T01 — How Computers Work": tutorials/foundations/t01-how-computers-work.md
  - Career Paths:
      - career-paths/index.md
      - Developer: career-paths/developer.md
      - Data Analyst: career-paths/data-analyst.md
      - ML Engineer: career-paths/ml-engineer.md
  - Projects:
      - projects/index.md
  - AI at Work:
      - ai-at-work/index.md
  - About:
      - about/index.md
